name: promogoai
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  camera: ^0.11.2+1
  country_picker: ^2.0.27
  currency_picker: ^2.0.21
  easy_localization: ^3.0.8
  flutter:
    sdk: flutter
  image_cropper: ^12.1.1
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  apivideo_live_stream: ^1.2.0
  video_player: ^2.8.3
  google_fonts: ^6.2.1
  record:
    git:
      url: https://github.com/llfbandit/record.git
      path: record
  http: ^1.2.1
  web_socket_channel: ^3.0.1
  flutter_markdown: ^0.7.3
  shimmer: ^3.0.0
  flutter_secure_storage: ^9.2.2
dev_dependencies:
  build_runner: ^2.4.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mockito: ^5.4.1
  stacked_generator: ^1.3.3
  golden_toolkit: ^0.15.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/
    - assets/video/live1.mp4
    - assets/video/live2.mp4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_app.png"
  adaptive_icon_background: "#03112E"
  adaptive_icon_foreground: "assets/images/logo_prepared.png"
  remove_alpha_ios: true
  min_sdk_android: 21
