name: promogoai
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  camera: ^0.11.2+1
  country_picker: ^2.0.27
  currency_picker: ^2.0.21
  easy_localization: ^3.0.8
  flutter:
    sdk: flutter
  image_cropper: ^12.1.1
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  cached_network_image: ^3.3.1
  haishin_kit: 0.15.0
  video_player: ^2.8.3
dev_dependencies:
  build_runner: ^2.4.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mockito: ^5.4.1
  stacked_generator: ^1.3.3
  golden_toolkit: ^0.15.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/translations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_app.png"
  adaptive_icon_background: "#03112E"
  adaptive_icon_foreground: "assets/images/logo_prepared.png"
  remove_alpha_ios: true
  min_sdk_android: 21
